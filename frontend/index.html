<!doctype html>
<!-- `lang="fr"` parce que le REPLI ci-dessous est français. `SEO.tsx` réécrit
     l'attribut à la locale du visiteur dès que le JS tourne; ce qui reste ici
     est ce que lit un robot, et il doit s'accorder avec le texte qu'il lit. -->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Le papier de la marque, et non l'ancien violet #6D28D9 — un jeton mort
         du produit grand public supprimé. C'est la couleur de la chrome du
         navigateur sur mobile: elle doit être le fond de la page, pas un accent. -->
    <meta name="theme-color" content="#FBF8FA" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="Y79Lt1_LtDrl-DoAJxsLROwYTwpr9GJ1UpDL_44zCcY" />
    <!-- PRÉCHARGEMENT DE LA SEULE POLICE DE TEXTE — la première visible.
         `crossorigin` est OBLIGATOIRE même en même origine: une police est
         récupérée en mode CORS, et sans lui le fichier est téléchargé DEUX fois.
         Vite réécrit et hache l'URL, et déduplique avec le `url()` du CSS.
         Young Serif n'est PAS préchargée: elle ne sert qu'aux titres display. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/src/assets/fonts/publicsans-latin.woff2"
    />
    <!-- ⚠️ CE BLOC EST LE SEUL QUE VOIT UN ROBOT D'APERÇU, ET C'EST TOUT LE
         PIÈGE. `components/SEO.tsx` réécrit titre, description, `og:` et
         `twitter:` page par page — mais dans un `useEffect`. WhatsApp,
         Messenger, LinkedIn, Slack, iMessage et X n'exécutent PAS le JS: ils
         lisent CE fichier, et rien d'autre. Un `SEO` correct au runtime ne
         répare donc RIEN sur un lien partagé.
         Mesuré le 2026-09-01: `og:`/`twitter:` annonçaient encore « Sophia —
         your method, answering every student, every day … on WhatsApp », en
         anglais, pour un produit B2B SUPPRIMÉ — sur les quatre pages de vente
         du foyer. Seule la `description` avait été corrigée au lot précédent
         (`CHARTE-VITRINE.md` §9 n°5); les six autres balises étaient restées.
         ⚠️ RÈGLE: toute phrase ici est un COPIE MOT POUR MOT de `home.seo_*`
         (`i18n/fr.ts`). Deux rédactions du même hall divergent en silence, et
         c'est exactement ce qui vient de coûter trois mois d'aperçus faux. -->
    <title>Sophia — la semaine de repas de votre maison, décidée</title>
    <meta name="description" content="Ce qu'on mange, quand on cuisine, ce qu'il faut acheter. Sophia compose la semaine de votre maison, que vous soyez seul, à deux, ou toute une famille." />
    <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />
    <link rel="canonical" href="https://sophia-coach.ai/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sophia-coach.ai/" />
    <meta property="og:title" content="Sophia — la semaine de repas de votre maison, décidée" />
    <meta property="og:description" content="Ce qu'on mange, quand on cuisine, ce qu'il faut acheter. Sophia compose la semaine de votre maison, que vous soyez seul, à deux, ou toute une famille." />
    <!-- « Sophia », et pas « Sophia Coach »: c'est le nom que porte déjà
         l'organisation dans les données structurées (`lib/legalEntity.ts`
         `organizationStructuredData`), et le mot « coach » n'apparaît nulle
         part sur les quatre pages du foyer — le laisser ici le remettait dans
         chaque aperçu et chaque onglet. -->
    <meta property="og:site_name" content="Sophia" />
    <meta property="og:locale" content="fr_FR" />
    <!-- ⚠️ PAS `apple-touch-icon.png`: une icône carrée de 1024 servie en
         `summary_large_image` rend un aperçu rogné et vide. `og-image.png` est
         une planche 1200×630 à la charte. -->
    <meta property="og:image" content="https://sophia-coach.ai/og-image.png" />
    <!-- Les dimensions RÉELLES du fichier, pas le 1200×630 nominal: la planche
         est rendue à 2× pour rester nette sur un écran dense, et une balise qui
         annonce une taille que le fichier n'a pas fait recadrer certains
         aperçus. Le rapport, lui, est bien 1.91:1. Régénérer avec
         `node scripts/og-image.mjs`. -->
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta property="og:image:alt" content="Sophia — la semaine de repas de votre maison, décidée" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sophia — la semaine de repas de votre maison, décidée" />
    <meta name="twitter:description" content="Ce qu'on mange, quand on cuisine, ce qu'il faut acheter. Sophia compose la semaine de votre maison, que vous soyez seul, à deux, ou toute une famille." />
    <meta name="twitter:image" content="https://sophia-coach.ai/og-image.png" />
    <meta name="twitter:image:alt" content="Sophia — la semaine de repas de votre maison, décidée" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
