<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300"
     role="img" aria-labelledby="fig-chat-t fig-chat-d">
  <title id="fig-chat-t">Une journée dans le chat de l'élève</title>
  <desc id="fig-chat-d">L'élève écrit ce qui s'est passé à midi et reçoit une réponse composée
    avec la méthode de son coach. Le soir, une question et trois boutons : « All good »,
    « So-so », « Rough ».</desc>

  <!-- MAQUETTE DE PRODUIT — copiée sur `etalon-maquette.svg`. Vue de face,
       strictement plate, aucune fenêtre de navigateur ni cadre de téléphone
       (AUDIT C17 : il n'existe aucune application mobile).

       MOT POUR MOT (S10) — les chaînes du soir sont prises dans le code :
         « How was today? »              daily_pulse.ts:114 PULSE_QUESTION_EN
         « All good » / « So-so » / « Rough »   daily_pulse.ts:84-88 LEVEL_LABELS_EN
       L'échange de midi est un EXEMPLE, et la légende de la page le dit : le
       contenu d'un vrai message est propre à un élève, il ne se cite pas.
       ⚠ L'ancienne page montrait « How did today go? » avec « Good / Mixed /
       Hard » — une paraphrase présentée comme une capture. C'est le défaut B13,
       et cette maquette existe pour ne pas le reproduire.

       AUCUNE PHOTO D'ASSIETTE. L'ancienne maquette en dessinait une avec deux
       taches vertes et ambre : de la couleur d'état sur une page de vente, et
       une assiette que personne n'a cuisinée. -->

  <path d="M 8 40 L 8 16 A 8 8 0 0 1 16 8 L 40 8"
        fill="none" stroke="var(--ill-fig, #632C4C)" stroke-width="2" stroke-linecap="round"/>
  <rect x="8" y="8" width="464" height="284" rx="16"
        fill="var(--ill-wash, #EFE0E9)" stroke="var(--ill-ink-soft, #6A5A64)" stroke-width="1"/>

  <g font-family="var(--font-text, ui-sans-serif, system-ui, sans-serif)">
    <text x="28" y="46" font-size="15" font-weight="600"
          fill="var(--ill-fig, #632C4C)">In their chat, today</text>

    <!-- ── CE QUE L'ÉLÈVE ÉCRIT — aligné à droite, contour de 2. ─────────── -->
    <text x="448" y="72" font-size="9" font-weight="600" letter-spacing="1" text-anchor="end"
          fill="var(--ill-ink-soft, #6A5A64)">THEM</text>
    <rect x="152" y="80" width="296" height="36" rx="12"
          fill="var(--ill-paper, #FBF8FA)" stroke="var(--ill-ink, #23191F)" stroke-width="2"/>
    <text x="168" y="103" font-size="11" fill="var(--ill-ink, #23191F)">Ate out at lunch — no idea what was in it.</text>

    <!-- ── CE QUE SOPHIA RÉPOND — aligné à gauche, annotation de 1. ──────── -->
    <text x="32" y="140" font-size="9" font-weight="600" letter-spacing="1"
          fill="var(--ill-ink-soft, #6A5A64)">SOPHIA</text>
    <rect x="32" y="148" width="328" height="52" rx="12"
          fill="var(--ill-paper, #FBF8FA)" stroke="var(--ill-ink-soft, #6A5A64)" stroke-width="1"/>
    <text x="48" y="170" font-size="11" fill="var(--ill-ink, #23191F)">Then keep tonight simple: a protein, greens,</text>
    <text x="48" y="188" font-size="11" fill="var(--ill-ink, #23191F)">a normal portion. One lunch out is not a week.</text>

    <!-- ── LE SOIR — la question et les trois boutons, mot pour mot. ─────── -->
    <text x="32" y="224" font-size="9" font-weight="600" letter-spacing="1"
          fill="var(--ill-ink-soft, #6A5A64)">IN THE EVENING</text>
    <rect x="32" y="232" width="328" height="48" rx="12"
          fill="var(--ill-paper, #FBF8FA)" stroke="var(--ill-ink-soft, #6A5A64)" stroke-width="1"/>
    <text x="48" y="252" font-size="11" fill="var(--ill-ink, #23191F)">How was today?</text>
    <g fill="none" stroke="var(--ill-ink-soft, #6A5A64)" stroke-width="1">
      <rect x="48" y="258" width="92" height="16" rx="8"/>
      <rect x="148" y="258" width="92" height="16" rx="8"/>
      <rect x="248" y="258" width="92" height="16" rx="8"/>
    </g>
    <g font-size="9" text-anchor="middle" fill="var(--ill-ink-soft, #6A5A64)">
      <text x="94" y="269">All good</text>
      <text x="194" y="269">So-so</text>
      <text x="294" y="269">Rough</text>
    </g>
  </g>
</svg>
