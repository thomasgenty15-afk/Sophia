<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240"
     role="img" aria-labelledby="fc-t fc-d" font-family="var(--font-sans, ui-sans-serif, system-ui, sans-serif)">
  <title id="fc-t">One message, from the question to what was sent</title>
  <desc id="fc-d">Three stages: a member&#8217;s question, the draft that broke a red line and was held, and the line that went out instead.</desc>
  <path d="M 8 32 L 8 16 A 8 8 0 0 1 16 8 L 32 8" fill="none" stroke="var(--ill-fig, #632C4C)" stroke-width="2" stroke-linecap="round"/>
  <text x="44" y="26" font-size="11" font-weight="600" letter-spacing="1.2" fill="var(--ill-ink-soft, #6A5A64)">ONE MESSAGE, END TO END</text>
  <g fill="none" stroke="var(--ill-ink-soft, #6A5A64)" stroke-width="1">
    <rect x="24" y="44" width="432" height="48" rx="12"/>
    <rect x="24" y="104" width="432" height="48" rx="12"/>
    <rect x="380" y="113" width="52" height="16" rx="8"/>
  </g>
  <text x="406" y="124" font-size="9" text-anchor="middle" fill="var(--ill-ink-soft, #6A5A64)">held</text>
  <text x="40" y="64" font-size="9" font-weight="600" letter-spacing="1" fill="var(--ill-ink-soft, #6A5A64)">A MEMBER ASKS</text>
  <text x="40" y="82" font-size="11" fill="var(--ill-paper, #FBF8FA)">&#8220;Should I add a snack between lunch and dinner?&#8221;</text>
  <text x="40" y="124" font-size="9" font-weight="600" letter-spacing="1" fill="var(--ill-ink-soft, #6A5A64)">THE DRAFT SAID</text>
  <text x="40" y="142" font-size="11" fill="var(--ill-ink-soft, #6A5A64)" text-decoration="line-through">&#8220;A small snack mid-afternoon can help.&#8221;</text>
  <rect x="24" y="164" width="432" height="52" rx="12" fill="none" stroke="var(--ill-paper, #FBF8FA)" stroke-width="2"/>
  <path d="M 40 172 L 40 208" stroke="var(--ill-fig, #632C4C)" stroke-width="2" stroke-linecap="round"/>
  <text x="56" y="184" font-size="9" font-weight="600" letter-spacing="1" fill="var(--ill-ink-soft, #6A5A64)">WHAT WENT OUT INSTEAD</text>
  <text x="56" y="202" font-size="11" fill="var(--ill-paper, #FBF8FA)">&#8220;Three real meals. If you are hungry, the meal before was too small.&#8221;</text>
</svg>
