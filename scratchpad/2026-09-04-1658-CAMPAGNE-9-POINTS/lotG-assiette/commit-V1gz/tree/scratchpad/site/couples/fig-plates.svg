<svg viewBox="0 0 480 240" xmlns="http://www.w3.org/2000/svg" font-family="Public Sans, sans-serif" role="img" aria-labelledby="cpl-plates-t cpl-plates-d">
      <title id="cpl-plates-t">Une casserole, deux parts</title>
      <desc id="cpl-plates-d">Une casserole vue de dessus. Deux assiettes identiques reçoivent le même plat. Ce qui diffère entre les deux n’est pas dessiné : c’est l’instruction de service, écrite en mots à côté de chaque assiette.</desc>
      <defs>
        <g id="cpl-part" fill="var(--ill-wash, #EFE0E9)" stroke="var(--ill-ink-soft, #6A5A64)" stroke-width="1" stroke-linejoin="round">
          <g transform="rotate(-30)"><rect x="-21" y="-17" width="26" height="12" rx="4" /></g>
          <g transform="rotate(30)"><rect x="-10" y="8" width="22" height="10" rx="5" /></g>
          <circle cx="16" cy="-5" r="7" />
          <circle cx="18" cy="9" r="5" />
          <circle cx="7" cy="-18" r="4" />
        </g>
      </defs>
      <path d="M 8 32 L 8 16 A 8 8 0 0 1 16 8 L 32 8" fill="none" stroke="var(--ill-fig, #632C4C)" stroke-width="2" stroke-linecap="round"/>
      <text x="44" y="26" font-size="11" font-weight="600" letter-spacing="1.2" fill="var(--ill-ink-soft, #6A5A64)">UNE SESSION DE CUISINE, DEUX PARTS</text>
      <g stroke="var(--ill-fig, #632C4C)" stroke-width="2" stroke-linejoin="round">
        <rect x="26" y="135" width="32" height="18" rx="9" fill="var(--ill-paper, #FBF8FA)" />
        <rect x="150" y="135" width="32" height="18" rx="9" fill="var(--ill-paper, #FBF8FA)" />
        <circle cx="104" cy="144" r="54" fill="var(--ill-paper, #FBF8FA)" />
      </g>
      <circle cx="104" cy="144" r="42" fill="var(--ill-wash, #EFE0E9)" />
      <text x="104" y="226" text-anchor="middle" font-size="13" fill="var(--ill-ink-soft, #6A5A64)">le même plat, cuit une fois</text>
      <g fill="none" stroke="var(--ill-ink-soft, #6A5A64)" stroke-width="1" stroke-linecap="round">
        <path d="M 160 128 L 235 108" />
        <path d="M 160 160 L 235 180" />
      </g>
      <g>
        <circle cx="270" cy="99" r="36" fill="var(--ill-paper, #FBF8FA)" stroke="var(--ill-ink, #23191F)" stroke-width="2" />
        <circle cx="270" cy="99" r="27" fill="none" stroke="var(--ill-ink-soft, #6A5A64)" stroke-width="1" />
        <use href="#cpl-part" x="270" y="99" />
      </g>
      <g>
        <circle cx="270" cy="189" r="36" fill="var(--ill-paper, #FBF8FA)" stroke="var(--ill-ink, #23191F)" stroke-width="2" />
        <circle cx="270" cy="189" r="27" fill="none" stroke="var(--ill-ink-soft, #6A5A64)" stroke-width="1" />
        <use href="#cpl-part" x="270" y="189" />
      </g>
      <g font-size="9" font-weight="600" letter-spacing="1" fill="var(--ill-ink-soft, #6A5A64)">
        <text x="322" y="83">PRENDRE DU MUSCLE</text>
        <text x="322" y="173">PERDRE DU GRAS</text>
      </g>
      <g font-size="13" fill="var(--ill-ink, #23191F)">
        <text x="322" y="102">plus de féculents<tspan x="322" dy="17">dans cette part</tspan></text>
        <text x="322" y="192">plus de légumes<tspan x="322" dy="17">dans cette part</tspan></text>
      </g>
    </svg>
