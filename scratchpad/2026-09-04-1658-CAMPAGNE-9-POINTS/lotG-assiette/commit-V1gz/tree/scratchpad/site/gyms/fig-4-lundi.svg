<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 248" width="480" height="248"
     role="img" aria-labelledby="fk-t fk-d" font-family="var(--font-sans, ui-sans-serif, system-ui, sans-serif)">
  <title id="fk-t">The Monday page: the members worth a message</title>
  <desc id="fk-d">Three members worth a message, each with the observed reason and their contact state, and on the third a plain statement that there is no number to show.</desc>
  <path d="M 8 40 L 8 16 A 8 8 0 0 1 16 8 L 40 8" fill="none" stroke="var(--ill-fig, #632C4C)" stroke-width="2" stroke-linecap="round"/>
  <rect x="8" y="8" width="464" height="232" rx="16" fill="var(--ill-wash, #EFE0E9)" stroke="var(--ill-ink-soft, #6A5A64)" stroke-width="1"/>
  <text x="28" y="46" font-size="15" font-weight="600" fill="var(--ill-fig, #632C4C)">This week</text>
  <rect x="24" y="64" width="432" height="158" rx="12" fill="var(--ill-paper, #FBF8FA)" stroke="var(--ill-ink-soft, #6A5A64)" stroke-width="1"/>
  <text x="40" y="88" font-size="9" font-weight="600" letter-spacing="0.9" fill="var(--ill-ink-soft, #6A5A64)">WORTH A MESSAGE</text>
  <path d="M 40 105 L 40 123" stroke="var(--ill-ink-soft, #6A5A64)" stroke-width="2" stroke-linecap="round"/>
  <text x="56" y="118" font-size="11" font-weight="600" fill="var(--ill-ink, #23191F)">Chen Wei</text>
  <text x="140" y="118" font-size="11" fill="var(--ill-ink-soft, #6A5A64)">Going quiet</text>
  <rect x="286" y="107" width="52" height="16" rx="8" fill="none" stroke="var(--ill-ink-soft, #6A5A64)" stroke-width="1"/>
  <text x="312" y="118" font-size="9" text-anchor="middle" fill="var(--ill-ink-soft, #6A5A64)">slipping</text>
  <path d="M 40 147 L 40 165" stroke="var(--ill-ink-soft, #6A5A64)" stroke-width="2" stroke-linecap="round"/>
  <text x="56" y="160" font-size="11" font-weight="600" fill="var(--ill-ink, #23191F)">Amina Diop</text>
  <text x="140" y="160" font-size="11" fill="var(--ill-ink-soft, #6A5A64)">Has not written in days</text>
  <rect x="286" y="149" width="52" height="16" rx="8" fill="none" stroke="var(--ill-ink-soft, #6A5A64)" stroke-width="1"/>
  <text x="312" y="160" font-size="9" text-anchor="middle" fill="var(--ill-ink-soft, #6A5A64)">silent</text>
  <path d="M 40 189 L 40 207" stroke="var(--ill-ink-soft, #6A5A64)" stroke-width="2" stroke-linecap="round"/>
  <text x="56" y="202" font-size="11" font-weight="600" fill="var(--ill-ink, #23191F)">Luca Ferrari</text>
  <text x="140" y="202" font-size="11" fill="var(--ill-ink-soft, #6A5A64)">Barely logged anything</text>
  <text x="286" y="202" font-size="9" fill="var(--ill-ink-soft, #6A5A64)">no number to show</text>
</svg>
