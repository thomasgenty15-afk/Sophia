<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240"
     role="img" aria-labelledby="fig-third-t fig-third-d">
  <title id="fig-third-t">Le troisième jour de silence</title>
  <desc id="fig-third-d">Une ligne de temps. À gauche, le dernier message d’un membre. Trois
    jours sans rien. Au troisième jour, un message part, composé sur la méthode publiée du
    coach. Puis la ligne repart nue : il n’en part qu’un.</desc>

  <!-- FIGURE C de /communities — le geste qu’un fil ne fera jamais.
       Chaque nombre dessiné ici est un seuil du code, pas une illustration :
       REENGAGE_AFTER_HOURS = 72 (reengagement.ts:45), UN message par épisode
       (:211-213), et les heures calmes 21 h-8 h qui ne couvrent QUE cette
       relance (reengagement.ts:60-61 — AUDIT B21/B24). La ligne qui repart nue
       après le message est donc une affirmation vérifiable, pas un effet.
       Pièce chaude : l’équerre + la fiche du message. = 2. -->

  <path d="M 8 32 L 8 16 A 8 8 0 0 1 16 8 L 32 8"
        fill="none" stroke="var(--ill-fig, #632C4C)" stroke-width="2" stroke-linecap="round"/>
  <text x="44" y="26" font-family="var(--font-text, ui-sans-serif, system-ui, sans-serif)"
        font-size="11" font-weight="600" letter-spacing="1.2"
        fill="var(--ill-ink-soft, #6A5A64)">THE THIRD QUIET DAY</text>

  <g font-family="var(--font-text, ui-sans-serif, system-ui, sans-serif)">

    <!-- ── LE DERNIER MESSAGE DU MEMBRE ────────────────────────────────────── -->
    <rect x="24" y="104" width="168" height="48" rx="4"
          fill="var(--ill-paper, #FBF8FA)" stroke="var(--ill-ink-soft, #6A5A64)" stroke-width="1"/>
    <text x="40" y="124" font-size="9" font-weight="600" letter-spacing="1"
          fill="var(--ill-ink-soft, #6A5A64)">THEIR LAST MESSAGE</text>
    <text x="40" y="142" font-size="13" fill="var(--ill-ink, #23191F)">then nothing</text>

    <!-- ── LE MESSAGE DU TROISIÈME JOUR ────────────────────────────────────── -->
    <g stroke="var(--ill-fig, #632C4C)">
      <rect x="268" y="104" width="172" height="48" rx="4"
            fill="var(--ill-wash, #EFE0E9)" stroke-width="1"/>
      <path d="M 268 116 L 268 140" fill="none" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="284" y="124" font-size="9" font-weight="600" letter-spacing="1"
          fill="var(--ill-ink-soft, #6A5A64)">ONE MESSAGE</text>
    <text x="284" y="142" font-size="13" fill="var(--ill-ink, #23191F)">in your method</text>

    <!-- ── LA LIGNE DE TEMPS. Quatre repères, un par jour. ─────────────────── -->
    <path d="M 40 172 L 440 172" fill="none"
          stroke="var(--ill-ink, #23191F)" stroke-width="2" stroke-linecap="round"/>
    <g fill="none" stroke="var(--ill-ink-soft, #6A5A64)" stroke-width="1" stroke-linecap="round">
      <path d="M 108 152 L 108 172"/>
      <path d="M 140 166 L 140 178"/>
      <path d="M 240 166 L 240 178"/>
      <path d="M 340 166 L 340 178"/>
      <path d="M 354 152 L 354 172"/>
    </g>

    <text x="232" y="200" font-size="11" text-anchor="middle"
          fill="var(--ill-ink-soft, #6A5A64)">three quiet days</text>
    <text x="440" y="200" font-size="11" text-anchor="end"
          fill="var(--ill-ink-soft, #6A5A64)">then it stops</text>
  </g>
</svg>
