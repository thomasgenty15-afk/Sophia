<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240"
     role="img" aria-labelledby="fig-method-t fig-method-d">
  <title id="fig-method-t">Une méthode, quatre endroits où elle est écrite</title>
  <desc id="fig-method-d">La méthode publiée du coach à gauche. À droite, les quatre choses que
    Sophia rédige pour un élève : son chat, la semaine qu'il compose, les repas qu'elle lui
    propose, les repas de son foyer. Chacune est composée avec la méthode dedans.</desc>

  <!-- FIGURE DE CONCEPT — copiée sur `etalon-concept.svg`.
       fait: B10 — 4 points d'injection (run.ts:1441,2503 · generate-week-plan-v1:338,541 ·
       generate-meal-v1:576,1038 · generate-household-meal-v1:1602,2249).
       La distribution est dessinée en BUS (0° / 90°) et non en éventail : quatre obliques
       vers quatre hauteurs différentes n'auraient pas pu tomber sur les angles fermés de F4.
       Une seule pièce chaude : l'équerre et la fiche de la méthode. -->

  <path d="M 8 32 L 8 16 A 8 8 0 0 1 16 8 L 32 8"
        fill="none" stroke="var(--ill-fig, #632C4C)" stroke-width="2" stroke-linecap="round"/>
  <text x="44" y="26" font-family="var(--font-text, ui-sans-serif, system-ui, sans-serif)"
        font-size="11" font-weight="600" letter-spacing="1.2"
        fill="var(--ill-ink-soft, #6A5A64)">RECORDED ONCE</text>

  <!-- ── LA FICHE DE LA MÉTHODE — la seule pièce chaude du dessin. ────────── -->
  <rect x="24" y="56" width="192" height="160" rx="12"
        fill="var(--ill-wash, #EFE0E9)" stroke="var(--ill-fig, #632C4C)" stroke-width="2"/>
  <g font-family="var(--font-text, ui-sans-serif, system-ui, sans-serif)">
    <text x="40" y="80" font-size="9" font-weight="600" letter-spacing="1"
          fill="var(--ill-ink-soft, #6A5A64)">YOUR METHOD</text>
    <g font-size="13" fill="var(--ill-ink, #23191F)">
      <text x="40" y="106">your convictions</text>
      <text x="40" y="130">your red lines</text>
      <text x="40" y="154">what you say instead</text>
      <text x="40" y="178">your vocabulary</text>
    </g>
  </g>

  <!-- ── LE BUS : 0° et 90°, rien d'autre. ──────────────────────────────── -->
  <g fill="none" stroke="var(--ill-ink-soft, #6A5A64)" stroke-width="1" stroke-linecap="round">
    <path d="M 216 136 L 252 136"/>
    <path d="M 252 64 L 252 208"/>
    <path d="M 252 64 L 284 64"/>
    <path d="M 252 112 L 284 112"/>
    <path d="M 252 160 L 284 160"/>
    <path d="M 252 208 L 284 208"/>
  </g>

  <!-- ── LES QUATRE SORTIES — même rectangle, quatre fois. ───────────────── -->
  <g fill="var(--ill-paper, #FBF8FA)" stroke="var(--ill-ink, #23191F)" stroke-width="2">
    <rect x="284" y="44" width="172" height="40" rx="12"/>
    <rect x="284" y="92" width="172" height="40" rx="12"/>
    <rect x="284" y="140" width="172" height="40" rx="12"/>
    <rect x="284" y="188" width="172" height="40" rx="12"/>
  </g>
  <g font-family="var(--font-text, ui-sans-serif, system-ui, sans-serif)"
     font-size="13" fill="var(--ill-ink, #23191F)">
    <text x="300" y="69">their chat</text>
    <text x="300" y="117">the week they build</text>
    <text x="300" y="165">the meals she drafts</text>
    <text x="300" y="213">their household meals</text>
  </g>
</svg>
