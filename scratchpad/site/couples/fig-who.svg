<svg viewBox="0 0 480 240" xmlns="http://www.w3.org/2000/svg" font-family="Public Sans, sans-serif" role="img" aria-labelledby="cpl-who-t cpl-who-d">
      <title id="cpl-who-t">Qui est dans le plan</title>
      <desc id="cpl-who-d">Le même foyer, deux façons d’en être. Sans compte, l’autre est quand même une bouche du foyer et reçoit quand même sa part. Le profil réclamé ajoute son propre accès, pour deux euros par mois.</desc>
      <path d="M 8 32 L 8 16 A 8 8 0 0 1 16 8 L 32 8" fill="none" stroke="var(--ill-fig, #632C4C)" stroke-width="2" stroke-linecap="round"/>
      <text x="44" y="26" font-size="11" font-weight="600" letter-spacing="1.2" fill="var(--ill-ink-soft, #6A5A64)">QUI EST DANS LE PLAN</text>
      <path d="M 24 60 L 24 52 L 456 52 L 456 60" fill="none" stroke="var(--ill-ink-soft, #6A5A64)" stroke-width="1" stroke-linejoin="round" />
      <path d="M 248 64 L 248 186" fill="none" stroke="var(--ill-fig, #632C4C)" stroke-width="2" stroke-linecap="round" />
      <g font-size="9" font-weight="600" letter-spacing="1" fill="var(--ill-ink-soft, #6A5A64)">
        <text x="24" y="80">SANS COMPTE</text>
        <text x="264" y="80">PROFIL RÉCLAMÉ</text>
      </g>
      <g font-size="13" fill="var(--ill-ink, #23191F)">
        <text x="24" y="110">une bouche du foyer</text>
        <text x="24" y="142">sa part est écrite</text>
        <text x="24" y="174">inclus</text>
        <text x="264" y="110">son propre accès</text>
        <text x="264" y="142">son objectif, modifiable</text>
        <text x="264" y="174">2 € par mois</text>
      </g>
      <g fill="none" stroke="var(--ill-ink-soft, #6A5A64)" stroke-width="1">
        <path d="M 24 122 L 224 122" />
        <path d="M 24 154 L 224 154" />
        <path d="M 264 122 L 456 122" />
        <path d="M 264 154 L 456 154" />
        <path d="M 24 196 L 456 196" />
      </g>
      <text x="24" y="218" font-size="13" fill="var(--ill-ink-soft, #6A5A64)">le compte qui ouvre le foyer n’est jamais compté</text>
    </svg>
