<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320"
     role="img" aria-labelledby="ft-t ft-d" font-family="var(--font-sans, ui-sans-serif, system-ui, sans-serif)">
  <title id="ft-t">The evening thread, as the product renders it</title>
  <desc id="ft-d">A chat surface. Sophia asks how the day went and offers three buttons; a second question asks which axis was hard. At the bottom, the composer.</desc>
  <path d="M 8 40 L 8 16 A 8 8 0 0 1 16 8 L 40 8" fill="none" stroke="var(--ill-fig, #632C4C)" stroke-width="2" stroke-linecap="round"/>
  <rect x="8" y="8" width="464" height="304" rx="16" fill="var(--ill-wash, #EFE0E9)" stroke="var(--ill-ink-soft, #6A5A64)" stroke-width="1"/>
  <text x="28" y="46" font-size="15" font-weight="600" fill="var(--ill-fig, #632C4C)">Sophia</text>
  <text x="28" y="64" font-size="9" fill="var(--ill-ink-soft, #6A5A64)">Your day-to-day, with your coach&#8217;s method behind it.</text>
  <path d="M 24 78 L 456 78" stroke="var(--ill-ink-soft, #6A5A64)" stroke-width="1"/>
  <g fill="var(--ill-paper, #FBF8FA)" stroke="var(--ill-ink-soft, #6A5A64)" stroke-width="1">
    <rect x="24" y="94" width="270" height="34" rx="12"/>
    <rect x="24" y="180" width="270" height="34" rx="12"/>
    <rect x="24" y="266" width="344" height="32" rx="16"/>
    <rect x="380" y="266" width="76" height="32" rx="16"/>
  </g>
  <g font-size="11" fill="var(--ill-ink, #23191F)">
    <text x="40" y="116">How was today?</text>
    <text x="40" y="202">What was hard?</text>
    <text x="418" y="286" text-anchor="middle">Send</text>
  </g>
  <text x="40" y="286" font-size="11" fill="var(--ill-ink-soft, #6A5A64)">Write to Sophia</text>
  <rect x="24" y="138" width="104" height="26" rx="12" fill="var(--ill-paper, #FBF8FA)" stroke="var(--ill-ink-soft, #6A5A64)" stroke-width="1"/>
  <text x="76" y="155" font-size="11" text-anchor="middle" fill="var(--ill-ink, #23191F)">All good</text>
  <rect x="136" y="138" width="104" height="26" rx="12" fill="var(--ill-paper, #FBF8FA)" stroke="var(--ill-ink-soft, #6A5A64)" stroke-width="1"/>
  <text x="188" y="155" font-size="11" text-anchor="middle" fill="var(--ill-ink, #23191F)">So-so</text>
  <rect x="248" y="138" width="104" height="26" rx="12" fill="var(--ill-paper, #FBF8FA)" stroke="var(--ill-ink-soft, #6A5A64)" stroke-width="1"/>
  <text x="300" y="155" font-size="11" text-anchor="middle" fill="var(--ill-ink, #23191F)">Rough</text>
  <rect x="24" y="224" width="104" height="26" rx="12" fill="var(--ill-paper, #FBF8FA)" stroke="var(--ill-ink-soft, #6A5A64)" stroke-width="1"/>
  <text x="76" y="241" font-size="11" text-anchor="middle" fill="var(--ill-ink, #23191F)">Energy</text>
  <rect x="136" y="224" width="104" height="26" rx="12" fill="var(--ill-paper, #FBF8FA)" stroke="var(--ill-ink-soft, #6A5A64)" stroke-width="1"/>
  <text x="188" y="241" font-size="11" text-anchor="middle" fill="var(--ill-ink, #23191F)">Hunger</text>
  <rect x="248" y="224" width="104" height="26" rx="12" fill="var(--ill-paper, #FBF8FA)" stroke="var(--ill-ink-soft, #6A5A64)" stroke-width="1"/>
  <text x="300" y="241" font-size="11" text-anchor="middle" fill="var(--ill-ink, #23191F)">Sleep</text>
</svg>
